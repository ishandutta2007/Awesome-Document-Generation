<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      .float-item1 { animation: floatSlow 7s ease-in-out infinite; }
      .float-item2 { animation: floatReverse 8s ease-in-out infinite; }
      .float-item3 { animation: floatSlow 6s< ease-in-out infinite 1.5s; }
      .pulse-bg { animation: pulseGlow 6s ease-in-out infinite alternate; }
      .data-stream { stroke-dashlines: 6 10; stroke-dashoffset: 0; animation: dashStream 2s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGradient)"/>

  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <circle class="pulse-bg" cx="150" cy="80" r="160" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="pulse-bg" cx="1080" cy="280" r="170" fill="#a855f7" filter="url(#glow)"/>
  <circle class="pulse-bg" cx="600" cy="180" r="140" fill="#6366f1" filter="url(#glow)"/>
  
  <g class="float-item1">
    <rect x="50" y="55" width="130" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="72" cy="74" r="6" fill="#38bdf8"/>
    <text x="86" y="79" fill="#e0f2fe" font-size="13" font-weight="600" letter-spacing="0.5">JSON → DOCX</text>
  </g>

  <g class="float-item2">
    <rect x="75" y="260" width="145" height="38" rx="19" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="97" cy="279" r="6" fill="#818cf8"/>
    <text x="111" y="284" fill="#e0e7ff" font-size="13" font-weight="600" letter-spacing="0.5">PDF/A & office</text>
  </g>

  <g class="float-item3">
    <rect x="1010" y="60" width="140" height="38" rx="19" fill="url(#pillGrad3)" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="1032" cy="79" r="6" fill="#c084fc"/>
    <text x="1046" y="84" fill="#f3e8ff" font-size="13" font-weight="600" letter-spacing="0.5">Template Merge</text>
  </g>

  <g class="float-item1">
    <rect x="985" y="255" width="155" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="1007" cy="274" r="6" fill="#38bdf8"/>
    <text x="1021" y="279" fill="#e0f2fe" font-size="13" font-weight="600" letter-spacing="0.5">High-Speed VDP</text>
  </g>

  <g transform="translate(470, 38)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="130" y="19" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <text x="600" y="128" fill="#ffffff" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Awesome Document Generation</text>
  <rect x="450" y="148" width="300" height="3.5" rx="1.75" fill="url(#accentGrad)"/>

  <text x="600" y="188" fill="#cbd5e1" font-size="18" font-weight="500" text-anchor="middle" letter-spacing="0.2">The Definitive Guide to Automated Document Assembly & PDF Pipelines</text>
  <text x="600" y="216" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">SaaS Enterprise Platforms • Open-Source Libraries • Batch VDP • PDF Signatures</text>

  <g transform="translate(340, 252)">
    <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="57" y="17" fill="#38bdf8" font-size="11.5" font-weight="600" text-anchor="middle">DOCX / Jinja2</text>

    <rect x="130" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="192" y="17" fill="#818cf8" font-size="11.5" font-weight="600" text-anchor="middle">Typst & HTML/CSS</text>

    <rect x="270" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="325" y="17" fill="#c084fc" font-size="11.5" font-weight="600" text-anchor="middle">Docker APIs</text>

    <rect x="395" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="457" y="17" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="middle">CRM &eSign CPQ</text>
  </g>
</svg>